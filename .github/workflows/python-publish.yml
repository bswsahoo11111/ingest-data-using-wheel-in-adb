# FIXED VERSION - Replace your entire workflow:-
name: Build and Push Wheel
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # v4 not v3
    
    - uses: actions/setup-python@v5  # v5 not v4
      with:
        python-version: '3.10'
    
    - run: |
        pip install --upgrade pip build
        python -m build --wheel
    
    # Upload to Databricks Volume (FIXED)
    - name: Upload to Volume
      env:
        DATABRICKS_HOST: https://dbc-376ffe1e-98d8.cloud.databricks.com  # Fixed URL
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}  # NEW TOKEN HERE
      run: |
        pip install databricks-cli
        # Use correct volume path (no dbfs: prefix for volumes)
        databricks fs cp dist/*.whl \
          dbfs://Volumes/dataeng/dataeng/dataeng_vol/wheel/ \
          --overwrite
