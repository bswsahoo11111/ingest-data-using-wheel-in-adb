name: Build and Push Wheel File
on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # Fixed v5→v4 (stable)
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build

    - name: Build wheel
      run: python -m build --wheel

    # ✅ AUTO-VERSION: Get wheel filename with timestamp
    - name: Get wheel filename
      id: wheel
      run: |
        WHEEL_FILE=$(ls -t dist/*.whl | head -n1)
        VERSION=$(echo $WHEEL_FILE | sed 's/.*-//; s/\.whl$//')
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        FULL_NAME="${VERSION}_${TIMESTAMP}.whl"
        
        echo "wheel_file=$WHEEL_FILE" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "full_name=$FULL_NAME" >> $GITHUB_OUTPUT
        echo "Wheel: $WHEEL_FILE -> $FULL_NAME"

    # Push to target repo with version
    - name: Checkout & push target repo
      env:
        PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git clone https://$PAT@github.com/bswsahoo11111/ingest-data-using-wheel-in-adb.git target-repo
        cd target-repo
        
        mkdir -p dist-wheel
        cp ../dist/*.whl dist-wheel/
        
        git config user.name "bswsahoo11111"
        git config user.email "bswsahoo11111@gmail.com"
        git add dist-wheel/
        git commit -m "Add wheel ${{ steps.wheel.outputs.version }} [skip ci]" || echo "No changes"
        git push

    # ✅ FIXED: Official Databricks CLI + Correct volume path
    - name: Upload to Databricks Volume
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        # Install OFFICIAL Databricks CLI
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        
        # Upload with versioned name (no dbfs: prefix!)
        databricks fs cp dist/*.whl \
          dbfs:/Volumes/dataeng/dataeng/dataeng_vol/wheel/ \
          --overwrite
        
        echo "✅ Uploaded to /Volumes/dataeng/dataeng/dataeng_vol/wheel/"
