name: Build Wheel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install build tools
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Step 4: Build wheel
      - name: Build wheel
        run: python -m build --wheel

      # Step 5: Move wheel file to another directory
      - name: Move wheel file
        run: |
          mkdir -p dist_wheels
          mv dist/*.whl dist_wheels/
