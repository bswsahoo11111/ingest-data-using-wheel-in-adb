name: Build and Push Versioned Wheel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build

    - name: Build wheel
      run: python -m build --wheel

    # ✅ AUTO-VERSION EVERY TRIGGER
    - name: Version wheel with timestamp
      id: version
      run: |
        WHEEL_FILE=$(ls -t dist/*.whl | head -n1)
        BASE_NAME=$(basename "$WHEEL_FILE" .whl)
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        RUN_NUMBER=${{ github.run_number }}
        NEW_NAME="${BASE_NAME}_${TIMESTAMP}_run${RUN_NUMBER}.whl"
        
        # Copy with new versioned name
        cp "$WHEEL_FILE" "dist/$NEW_NAME"
        
        echo "original_wheel=$WHEEL_FILE" >> $GITHUB_OUTPUT
        echo "versioned_wheel=$NEW_NAME" >> $GITHUB_OUTPUT
        echo "run_number=${RUN_NUMBER}" >> $GITHUB_OUTPUT
        echo "✅ Created: $NEW_NAME"

    # ✅ SIMPLIFIED: Push to SAME repo (no target repo needed)
    - name: Commit versioned wheel
      run: |
        mkdir -p dist-wheel
        cp dist/*_*.whl dist-wheel/  # Only versioned wheels
        
        git config user.name "bswsahoo11111"
        git config user.email "bswsahoo11111@gmail.com"
        git add dist-wheel/
        git commit -m "Add wheel ${{ steps.version.outputs.versioned_wheel }} [skip ci]" || echo "No changes"
        git push

    # ✅ FIXED: Correct CLI + Volume path
    - name: Upload to Databricks
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
        
        # Upload ONLY versioned wheel
        VERSIONED_WHEEL=$(ls dist/*_*_*.whl | head -n1)
        databricks fs cp "$VERSIONED_WHEEL" \
          dbfs:/Volumes/dataeng/dataeng/dataeng_vol/wheel/" 
          --overwrite
          
        echo "✅ Uploaded: $VERSIONED_WHEEL"
